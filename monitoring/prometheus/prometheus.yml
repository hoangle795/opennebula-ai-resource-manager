global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    project: nt114-aiops
    environment: lab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus

  - job_name: alertmanager
    static_configs:
      - targets:
          - localhost:9093
        labels:
          service: alertmanager

  - job_name: node
    static_configs:
      - targets:
          - localhost:9100
        labels:
          nodename: host-node
          role: opennebula-host

  - job_name: aiops-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.0.100.226:8000
        labels:
          service: nebulastack-aiops
          role: ai-agent
